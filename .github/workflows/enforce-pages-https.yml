name: Enforce Pages HTTPS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Enable HTTPS when the certificate is ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u

          already_enabled="$(gh api "repos/${REPO}/pages" --jq '.https_enforced')"
          if [ "${already_enabled}" = "true" ]; then
            echo "HTTPS is already enforced."
            exit 0
          fi

          set +e
          output="$(gh api "repos/${REPO}/pages" -X PUT -F https_enforced=true 2>&1)"
          status=$?
          set -e
          echo "${output}"

          if [ "${status}" -eq 0 ]; then
            echo "HTTPS enforcement enabled."
            exit 0
          fi

          if printf '%s' "${output}" | grep -qi "certificate does not exist yet"; then
            echo "Certificate is still pending; the next scheduled run will retry."
            exit 0
          fi

          exit "${status}"
