<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://www.organizedbeez.com/" />
    <title>Redirecting to The Organized Bee</title>
    <script>
      (function () {
        var destination = new URL("https://www.organizedbeez.com");
        destination.pathname = window.location.pathname;
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.toString());
      })();
    </script>
  </head>
  <body>
    <p>
      Redirecting to
      <a href="https://www.organizedbeez.com/">www.organizedbeez.com</a>.
    </p>
  </body>
</html>
